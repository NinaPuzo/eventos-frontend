name: Build and deploy React app to Azure Web App - EventosWebApp
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'   # 24.x je previše novo, App Service ga ne podržava pouzdano

      - name: npm install and build
        run: |
          npm ci
          npm run build

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: react-app
          path: dist    # <-- KLJUČNA IZMENA: samo build output, ne ceo repo

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: react-app
          path: dist

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9AF59F2B163044A4B23BB8F7DDD402B6 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D008F3E0EE384C8BAF22CEDE393D64D2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_052D810927E942EAB52058391A0BD909 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'EventosWebApp'
          slot-name: 'Production'
          package: dist
